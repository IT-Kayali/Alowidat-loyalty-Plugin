name: CI and Plugin ZIP

on:
  push:
    branches:
      - main
      - 'phase2/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show PHP version
        run: php -v

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: Verify version consistency
        shell: bash
        run: |
          set -euo pipefail
          HEADER_VERSION="$(sed -n 's/^ \* Version:[[:space:]]*//p' it-kayali-loyalty.php | head -n1)"
          CONST_VERSION="$(sed -n "s/.*define('ITK_LOYALTY_VERSION',[[:space:]]*'\([^']*\)').*/\1/p" it-kayali-loyalty.php | head -n1)"
          STABLE_TAG="$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -n1)"
          echo "Header: $HEADER_VERSION"
          echo "Constant: $CONST_VERSION"
          echo "Stable tag: $STABLE_TAG"
          test -n "$HEADER_VERSION"
          test "$HEADER_VERSION" = "$CONST_VERSION"
          test "$HEADER_VERSION" = "$STABLE_TAG"

      - name: Build installable plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ \* Version:[[:space:]]*//p' it-kayali-loyalty.php | head -n1)"
          ROOT="$RUNNER_TEMP/package"
          mkdir -p "$ROOT/it-kayali-loyalty"
          rsync -a ./ "$ROOT/it-kayali-loyalty/"             --exclude '.git/'             --exclude '.github/'             --exclude '.gitignore'             --exclude '.gitkeep'             --exclude 'build/'             --exclude '*.zip'
          cd "$ROOT"
          zip -qr "$GITHUB_WORKSPACE/it-kayali-loyalty-$VERSION.zip" it-kayali-loyalty

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: it-kayali-loyalty-plugin
          path: it-kayali-loyalty-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ \* Version:[[:space:]]*//p' it-kayali-loyalty.php | head -n1)"
          TAG="v$VERSION"
          ZIP="it-kayali-loyalty-$VERSION.zip"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && /^## \\[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving the existing tag/release unchanged."
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "IT-Kayali Loyalty $TAG" --notes-file release-notes.md
          fi
